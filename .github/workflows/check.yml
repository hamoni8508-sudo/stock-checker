name: Stock Checker

on:
  schedule:
    # 20분마다 GitHub 실행 요청
    - cron: '*/20 * * * *'
  workflow_dispatch:

# 중복 실행 방지 설정 (이전 작업이 진행 중이면 자동으로 정리 후 교체)
concurrency:
  group: stock-checker-group
  cancel-in-progress: true

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 패키지 및 가상 브라우저(Playwright) 설치
        run: |
          pip install requests playwright
          playwright install chromium --with-deps

      - name: 재고 감지 스크립트 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python check_stock.py
