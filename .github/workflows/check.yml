name: Stock Checker

on:
  schedule:
    # 안전장치용 2시간 크론 스케줄 (API 바통 터치가 실패할 경우를 대비한 백업)
    - cron: '0 */2 * * *'
  workflow_dispatch:

# API로 스스로를 호출할 수 있도록 권한 부여
permissions:
  contents: read
  actions: write

concurrency:
  group: stock-checker-group
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Playwright 브라우저 캐시 설정 (설치 시간 15초로 단축)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/check_stock.py') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 패키지 및 가상 브라우저(Playwright) 설치
        run: |
          pip install requests playwright
          playwright install chromium --with-deps

      - name: 재고 감지 스크립트 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python check_stock.py
